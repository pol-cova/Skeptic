<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">Skeptic verification architecture</title>
  <desc id="desc">Config-driven flow from acceptance criteria through agent or scenario replay to evidence and reports</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <style>
      .layer { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 16; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.8; rx: 10; }
      .title { font: 700 15px ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .label { font: 13px ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .small { font: 11px ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .layer-title { font: 700 12px ui-sans-serif, system-ui, sans-serif; fill: #475569; letter-spacing: 0.04em; }
      .line { stroke: #475569; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 6 4; }
    </style>
  </defs>

  <!-- Layers -->
  <rect class="layer" x="20" y="20" width="940" height="95"/>
  <text class="layer-title" x="36" y="42">INPUT</text>

  <rect class="layer" x="20" y="130" width="940" height="130"/>
  <text class="layer-title" x="36" y="152">RUNTIME</text>

  <rect class="layer" x="20" y="275" width="940" height="120"/>
  <text class="layer-title" x="36" y="297">EVIDENCE</text>

  <rect class="layer" x="20" y="410" width="940" height="90"/>
  <text class="layer-title" x="36" y="432">OUTPUT</text>

  <!-- Input boxes -->
  <rect class="box" x="40" y="55" width="150" height="48"/>
  <text class="title" x="56" y="77">proof.config.ts</text>
  <text class="small" x="56" y="93">app, auth, limits, scenario</text>

  <rect class="box" x="210" y="55" width="150" height="48"/>
  <text class="title" x="226" y="77">acceptance.md</text>
  <text class="small" x="226" y="93">numbered criteria</text>

  <rect class="box" x="380" y="55" width="150" height="48"/>
  <text class="title" x="396" y="77">scenario.ts</text>
  <text class="small" x="396" y="93">buildScenario() steps</text>

  <rect class="box" x="550" y="55" width="170" height="48"/>
  <text class="title" x="566" y="77">Target application</text>
  <text class="small" x="566" y="93">your app under test</text>

  <!-- Runtime boxes -->
  <rect class="box" x="40" y="170" width="130" height="70"/>
  <text class="title" x="56" y="196">CLI</text>
  <text class="small" x="56" y="214">verify | replay | report</text>
  <text class="small" x="56" y="228">init</text>

  <rect class="box" x="190" y="170" width="150" height="70"/>
  <text class="title" x="206" y="196">Eve agent</text>
  <text class="small" x="206" y="214">plan + adapt (optional)</text>
  <text class="small" x="206" y="228">bounded by limits</text>

  <rect class="box" x="360" y="170" width="180" height="70"/>
  <text class="title" x="376" y="196">Playwright harness</text>
  <text class="small" x="376" y="214">typed BrowserAction API</text>
  <text class="small" x="376" y="228">origin guard + network log</text>

  <rect class="box" x="560" y="170" width="130" height="70"/>
  <text class="title" x="576" y="196">Oracle</text>
  <text class="small" x="576" y="214">PASS FAIL from</text>
  <text class="small" x="576" y="228">assertions only</text>

  <rect class="box" x="710" y="170" width="150" height="70"/>
  <text class="title" x="726" y="196">Run plan</text>
  <text class="small" x="726" y="214">prerequisites</text>
  <text class="small" x="726" y="228">UNVERIFIABLE skip</text>

  <!-- Evidence boxes -->
  <rect class="box" x="40" y="315" width="170" height="60"/>
  <text class="title" x="56" y="341">Evidence store</text>
  <text class="small" x="56" y="359">events.jsonl + metadata</text>

  <rect class="box" x="230" y="315" width="150" height="60"/>
  <text class="title" x="246" y="341">Artifacts</text>
  <text class="small" x="246" y="359">screenshots, traces</text>

  <rect class="box" x="400" y="315" width="150" height="60"/>
  <text class="title" x="416" y="341">replay.json</text>
  <text class="small" x="416" y="359">model-free replay</text>

  <rect class="box" x="570" y="315" width="180" height="60"/>
  <text class="title" x="586" y="341">Playwright export</text>
  <text class="small" x="586" y="359">generated/*.spec.ts</text>

  <!-- Output boxes -->
  <rect class="box" x="40" y="445" width="140" height="42"/>
  <text class="title" x="56" y="472">report.html</text>

  <rect class="box" x="200" y="445" width="140" height="42"/>
  <text class="title" x="216" y="472">report.md</text>

  <rect class="box" x="360" y="445" width="180" height="42"/>
  <text class="title" x="376" y="472">Exit code 0–3</text>

  <rect class="box" x="560" y="445" width="200" height="42"/>
  <text class="title" x="576" y="472">Readiness aggregate</text>

  <!-- Flow lines -->
  <path class="line" d="M115 103 V130"/>
  <path class="line" d="M285 103 V130"/>
  <path class="line" d="M455 103 V130"/>
  <path class="line" d="M170 205 H190"/>
  <path class="line" d="M340 205 H360"/>
  <path class="line" d="M540 205 H560"/>
  <path class="line" d="M690 205 H710"/>
  <path class="line dash" d="M265 205 H360"/>
  <text class="small" x="278" y="198">--deterministic</text>
  <path class="line" d="M450 240 V275"/>
  <path class="line" d="M625 240 V275"/>
  <path class="line" d="M125 375 V410"/>
  <path class="line" d="M475 375 V410"/>

  <text class="label" x="40" y="505">Deterministic path: scenario.ts → harness replay (0 model calls). Agent path: Eve plans within proof.config limits.</text>
</svg>
