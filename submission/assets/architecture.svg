<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Skeptic architecture</title>
  <desc id="desc">Markdown criteria flow through Eve agent and Playwright harness to evidence store and reports</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 12; }
      .title { font: 700 16px system-ui, sans-serif; fill: #0f172a; }
      .label { font: 14px system-ui, sans-serif; fill: #334155; }
      .small { font: 12px system-ui, sans-serif; fill: #64748b; }
      .line { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="box" x="30" y="40" width="180" height="70"/>
  <text class="title" x="50" y="70">Markdown criteria</text>
  <text class="small" x="50" y="92">acceptance.md</text>
  <rect class="box" x="280" y="20" width="200" height="90"/>
  <text class="title" x="300" y="50">Eve agent</text>
  <text class="small" x="300" y="72">interpret · plan · adapt</text>
  <rect class="box" x="280" y="150" width="200" height="90"/>
  <text class="title" x="300" y="180">Playwright harness</text>
  <text class="small" x="300" y="202">typed actions · evidence</text>
  <rect class="box" x="550" y="85" width="160" height="90"/>
  <text class="title" x="570" y="115">Oracle</text>
  <text class="small" x="570" y="137">PASS / FAIL from assertions</text>
  <rect class="box" x="550" y="230" width="200" height="90"/>
  <text class="title" x="570" y="260">Evidence store</text>
  <text class="small" x="570" y="282">events.jsonl · replay.json</text>
  <rect class="box" x="780" y="150" width="120" height="70"/>
  <text class="title" x="795" y="180">Reports</text>
  <text class="small" x="795" y="202">HTML · MD</text>
  <path class="line" d="M210 75 H280"/>
  <path class="line" d="M380 110 V150"/>
  <path class="line" d="M480 195 H550"/>
  <path class="line" d="M630 175 V230"/>
  <path class="line" d="M750 275 H780 185"/>
  <text class="label" x="30" y="360">Deterministic verify bypasses Eve planning (zero model calls).</text>
  <text class="label" x="30" y="385">Replay re-executes recorded steps from replay.json without model access.</text>
</svg>
